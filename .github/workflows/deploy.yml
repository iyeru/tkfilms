name: Deploy to GitHub Pages

# いま公開しているのは design/（Claude Design のデザイン原本）。
# React + TypeScript 版のソースは src/ に残してあるが、まだ配信していない。
#
# React 版の配信に切り替えるとき:
#   1. build ジョブの「デザイン原本を配信」ステップを消す
#   2. 下にコメントアウトしてある「React 版をビルドして配信」の4ステップを有効にする
#   （逆に戻すときはその逆）

on:
  push:
    branches: [main]
  # Actions タブから手動で流したいとき用
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。走行中に push されたら古い方を捨てる
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- デザイン原本を配信（現在有効） ---------------------------------
      # ビルド不要。design/ をそのまま配る
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: design

      # --- React 版をビルドして配信（切り替えるときはこちらを有効にする） ---
      # - uses: actions/setup-node@v7
      #   with:
      #     node-version: 22
      #     cache: npm
      # - run: npm ci
      # - run: npm run build
      # - uses: actions/configure-pages@v6
      # - uses: actions/upload-pages-artifact@v5
      #   with:
      #     path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
