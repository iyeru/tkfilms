name: Deploy to GitHub Pages

# いま公開しているのは src/（React + TypeScript 版）をビルドしたもの。
# design/（Claude Design のデザイン原本）は配信していないが、見た目の正解として
# リポジトリに残してあり、visual/ の比較で基準に使っている（visual/README.md）。
#
# design/ の直接配信に戻すとき:
#   1. build ジョブの「React 版をビルドして配信」の5ステップを消す
#   2. 下にコメントアウトしてある「デザイン原本を配信」の2ステップを有効にする
#   ただし design/ には CNAME が無いため、戻すと独自ドメインの設定が外れる。
#   戻す場合は design/CNAME を置くか、リポジトリ設定で指定し直すこと。

on:
  push:
    branches: [main]
  # Actions タブから手動で流したいとき用
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。走行中に push されたら古い方を捨てる
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # --- React 版をビルドして配信（現在有効） ---------------------------
      # npm run build は型チェック込み。落ちればここで止まり、公開はされない。
      # 独自ドメイン用の public/CNAME も dist/ に入って一緒に配信される。
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # --- デザイン原本を配信（戻すときはこちらを有効にする） -------------
      # ビルド不要。design/ をそのまま配る
      # - uses: actions/configure-pages@v6
      # - uses: actions/upload-pages-artifact@v5
      #   with:
      #     path: design

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
